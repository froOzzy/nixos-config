config_version = 14

[bar.default]
background_opacity = 0.4999999888241291
capsule = true
center = [ "clock", "notifications" ]
end = [ "media", "tray", "clipboard", "network", "volume", "brightness", "session" ]
shadow = false

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_color = "secondary"
font_family = "Symbols Nerd Font"

    [shell.launcher]
    compact = true

    [shell.panel]
    launcher_position = "top_center"

[theme]
builtin = "Rosé Pine"
community_palette = "One Dark Two"
custom_palette = "cosmic"
mode = "dark"
shell_mode = "dark"
source = "custom"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper.default]
path = "/home/vladislav/.config/nixos-config/modules/wallpapers/astronaut.png"

[wallpaper.last]
path = "/home/vladislav/.config/nixos-config/modules/wallpapers/astronaut.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/vladislav/.config/nixos-config/modules/wallpapers/astronaut.png"

[weather]
enabled = false

[widget.clock]
format = "%Y-%m-%d %H:%M:%S"

[widget.workspaces]
label_source = "name"
